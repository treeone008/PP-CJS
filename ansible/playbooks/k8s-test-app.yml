---
- name: PayGuard 라우팅 테스트용 앱 배포
  hosts: master
  become: yes
  environment:
    KUBECONFIG: /root/.kube/config
  tasks:
    - name: 1. 테스트용 K8s Manifest 파일 생성
      copy:
        dest: /tmp/payguard-test.yaml
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: payguard-test-app
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: payguard-test
            template:
              metadata:
                labels:
                  app: payguard-test
              spec:
                containers:
                - name: web
                  image: nginx:alpine
                  ports:
                  - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: payguard-test-svc
          spec:
            selector:
              app: payguard-test
            ports:
            - port: 80
              targetPort: 80
            type: ClusterIP
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: payguard-test-ingress
            annotations:
              kubernetes.io/ingress.class: nginx
          spec:
            rules:
            - http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: payguard-test-svc
                      port:
                        number: 80

    - name: 2. Manifest 적용 (kubectl apply)
      command: kubectl apply -f /tmp/payguard-test.yaml
