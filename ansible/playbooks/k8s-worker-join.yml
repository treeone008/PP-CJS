---
- name: K8s Worker 노드 클러스터 조인(Join)
  hosts: workers
  become: yes
  tasks:
    - name: 1. 베스천 서버(로컬)에 저장된 Join 명령어 읽어오기
      set_fact:
        join_cmd: "{{ lookup('file', '/tmp/k8s_join_command.sh') }}"

    - name: 2. Worker 노드에서 Join 명령어 실행 (클러스터 합류)
      command: "{{ join_cmd }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

