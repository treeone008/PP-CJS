spec:
  template:
    spec:
      volumes:
      - name: log-volume
        emptyDir: {}
      - name: filebeat-config-vol
        configMap:
          name: filebeat-config
      containers:
      - name: payment-api
        image: ghcr.io/treeone008/payguard-api:15
        volumeMounts:
        - name: log-volume
          mountPath: /var/log/payguard
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.12.1
        args: ["-c", "/etc/filebeat.yml", "-e"]
        volumeMounts:
        - name: filebeat-config-vol
          mountPath: /etc/filebeat.yml
          subPath: filebeat.yml
        - name: log-volume
          mountPath: /var/log/payguard
