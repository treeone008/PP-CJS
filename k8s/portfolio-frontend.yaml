apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>Choi Jinseong | DevSecOps</title>
        <style>
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
            .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; max-width: 500px; }
            h1 { color: #2c3e50; margin-bottom: 10px; }
            p { color: #7f8c8d; line-height: 1.6; margin-bottom: 30px; }
            .btn-group a { display: inline-block; margin: 0 10px; padding: 12px 24px; text-decoration: none; color: white; border-radius: 6px; font-weight: bold; transition: opacity 0.3s; }
            .btn-github { background-color: #24292e; }
            .btn-notion { background-color: #000000; }
            .btn-group a:hover { opacity: 0.8; }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>🛡️ PayGuard Project</h1>
            <h2>Choi Jinseong</h2>
            <p>Hybrid Cloud DevSecOps Engineer<br>이 도메인은 kt cloud와 OpenStack 망분리 인프라 위에서 구동되는 PayGuard 프로젝트의 메인 클러스터입니다.</p>
            <div class="btn-group">
                <a href="https://github.com/treeone008/PP-CJS" target="_blank" class="btn-github">GitHub</a>
                <a href="https://invited-gooseberry-a24.notion.site/3c6f9cc12b27804d9c0bed607f4243dc?source=copy_link" target="_blank" class="btn-notion">Notion Resume</a>
            </div>
        </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-frontend
  template:
    metadata:
      labels:
        app: portfolio-frontend
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html # Nginx 기본 웹 디렉토리에 ConfigMap 주입
      volumes:
      - name: html-volume
        configMap:
          name: portfolio-html
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-frontend-svc
spec:
  selector:
    app: portfolio-frontend
  ports:
  - port: 80
    targetPort: 80
